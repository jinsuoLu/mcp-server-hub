---
name: Bug Report
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Describe the bug
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
  - type: input
    attributes:
      label: Server name (e.g., weather, translator)
  - type: input
    attributes:
      label: Node.js version
      placeholder: "node -v"
