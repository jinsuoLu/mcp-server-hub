---
name: Feature Request
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What problem does this solve?
      description: Describe the problem or use case
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: How should it work?
  - type: dropdown
    attributes:
      label: Type
      options:
        - New server
        - New tool (existing server)
        - CLI improvement
        - Documentation
        - Other
