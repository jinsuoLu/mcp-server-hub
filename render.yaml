services:
  - type: web
    name: mcp-server-weather
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: "node packages/server-weather/dist/index.js"
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: mcp-server-translator
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: "node packages/server-translator/dist/index.js"
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: mcp-server-datetime
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: "node packages/server-datetime/dist/index.js"
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: mcp-server-calculator
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: "node packages/server-calculator/dist/index.js"
